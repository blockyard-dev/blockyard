[project]
name = "blocky"
version = "0.1.0"
description = "Blocky Workflow — Scratch 風格的自動化工作流 runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # `ctx.http`（§7.4）：積木包共用的 HTTP client 由 host 提供，所以 httpx 是
    # runtime 的相依而不是某個積木包的。延遲 import——沒有包用到網路時它不會
    # 被載進 process（`extensions/httpclient.py`）。
    "httpx>=0.27,<1",
    # secret 存進 OS keyring（§12.1），不是 project.json 或任何檔案。
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
]

[project.scripts]
blocky = "blocky.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blocky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 積木包自帶 tests/（§7.1、§17.4），而它們住在 backend/ 外面。一句 pytest 要
# 跑得完全部：包壞掉與 runtime 壞掉是同一個回歸網的兩半。
testpaths = ["tests", "../extensions"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
