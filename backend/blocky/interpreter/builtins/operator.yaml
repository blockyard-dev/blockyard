# operator 命名空間的宣告（D21、§4.4.1）。
#
# 關於 `default`：對積木包來說它是 Host 邊界的補值，對內建來說它是**編輯器的
# 影子值**——輸入孔裡預先填好的那個數字。handler 自己還有一層 fallback（給
# 手寫 IR 用），兩者刻意不一定相同，例如 `substring` 的 end 在 handler 裡是
# 「整段長度」，那是宣告寫不出來的東西。
#
# 文字類參數一律給**樣本值**（「你好」「世界」），不是空字串。理由是 §5.1 的
# 「點一下就跑」：從工具箱拉一顆出來點一下，空孔的積木只會回一個空字串，而
# 帶樣本值的積木直接示範它在做什麼。Scratch 的 `join (apple)(banana)` 就是
# 這件事——樣本值是積木的說明書，只是寫在它自己身上。
manifestVersion: 1
builtin: true
id: operator
name: 運算
version: 1.0.0
color: "#59C059"
description: 算術、比較、邏輯、字串與正規表達式

palette:
  # ---- 算術 ----
  #
  # `expr` 與下面那些單一運算的積木**刻意並存**（§4.7b）。一顆一顆拉是看得見
  # 每一步中間值的路，那條路一顆積木都沒有拿掉；`expr` 是給「(${金額}*2)/4+1」
  # 這種三層巢狀才寫得出來的算式用的，那正是使用者回報的積木肥大。

  - opcode: expr
    type: reporter
    returns: number
    text: "運算 %(expr)"
    args:
      # 樣本值示範的是這顆積木唯一的賣點：括號與多個運算子。點一下就跑會回 9。
      expr: { type: expression, default: "(1 + 2) * 3" }

  - opcode: add
    type: reporter
    returns: number
    text: "%(a) + %(b)"
    args: { a: { type: number, default: 0 }, b: { type: number, default: 0 } }

  - opcode: subtract
    type: reporter
    returns: number
    text: "%(a) − %(b)"
    args: { a: { type: number, default: 0 }, b: { type: number, default: 0 } }

  - opcode: multiply
    type: reporter
    returns: number
    text: "%(a) × %(b)"
    args: { a: { type: number, default: 0 }, b: { type: number, default: 0 } }

  - opcode: divide
    type: reporter
    returns: number
    text: "%(a) ÷ %(b)"
    args: { a: { type: number, default: 0 }, b: { type: number, default: 1 } }

  - opcode: mod
    type: reporter
    returns: number
    text: "%(a) 除以 %(b) 的餘數"
    args: { a: { type: number, default: 0 }, b: { type: number, default: 1 } }

  - opcode: round
    type: reporter
    returns: number
    # JS 的 Math.round：.5 一律進位到較大值
    text: "四捨五入 %(value)"
    args: { value: { type: number, default: 0 } }

  - opcode: math_op
    type: reporter
    returns: number
    text: "%(op) %(value)"
    args:
      op:
        type: dropdown
        field: true
        default: abs
        options:
          - { value: abs, label: "絕對值" }
          - { value: floor, label: "無條件捨去" }
          - { value: ceiling, label: "無條件進位" }
          - { value: sqrt, label: "平方根" }
          - { value: sin, label: "sin" }
          - { value: cos, label: "cos" }
          - { value: tan, label: "tan" }
          - { value: ln, label: "ln" }
          - { value: log, label: "log" }
          - { value: "e^", label: "e^" }
          - { value: "10^", label: "10^" }
      value: { type: number, default: 0 }

  # ---- 比較（§4.4.1）。eq / neq 不做型別轉換；大小比較型別混用是錯誤。----
  #
  # `op` 是下拉而不是兩顆新積木（D24）：`=` 與 `≈` 問的是同一個問題，差別只在
  # 「要不要先把兩邊整理成同一種東西」。做成兩顆積木的話，工具箱裡會有四顆長得
  # 幾乎一樣的比較積木，而使用者要先看懂四個符號才選得下去。
  #
  # 欄位值是 `exact` / `approx` 而不是 `=` / `≈`：符號會隨介面語言變（§16 Q5 的
  # i18n 要換的正是 label），opcode 與欄位值不會（§13.1）。舊專案沒有這一格，
  # handler 的 fallback 是 `exact`——`=` 的語意一個字都沒有改。

  - section: true
  - opcode: eq
    type: boolean
    text: "%(a) %(op) %(b)"
    args:
      a: { type: string, default: "" }
      op:
        type: dropdown
        field: true
        default: exact
        options:
          - { value: exact, label: "=" }
          - { value: approx, label: "≈" }
      b: { type: string, default: "" }

  - opcode: neq
    type: boolean
    text: "%(a) %(op) %(b)"
    args:
      a: { type: string, default: "" }
      op:
        type: dropdown
        field: true
        default: exact
        options:
          - { value: exact, label: "≠" }
          - { value: approx, label: "≉" }
      b: { type: string, default: "" }

  - opcode: lt
    type: boolean
    text: "%(a) < %(b)"
    args: { a: { type: string, default: "" }, b: { type: string, default: "" } }

  - opcode: gt
    type: boolean
    text: "%(a) > %(b)"
    args: { a: { type: string, default: "" }, b: { type: string, default: "" } }

  - opcode: lte
    type: boolean
    text: "%(a) ≤ %(b)"
    args: { a: { type: string, default: "" }, b: { type: string, default: "" } }

  - opcode: gte
    type: boolean
    text: "%(a) ≥ %(b)"
    args: { a: { type: string, default: "" }, b: { type: string, default: "" } }

  # ---- 邏輯。and / or 短路，右邊的 reporter 可以帶副作用，所以短路是語意。----
  #
  # `true` / `false` 是**字面值積木**，不是運算。它們存在的理由是六角形孔
  # （`if`、`repeat_until`、`and`）**沒有影子**——§8.1 明講那是刻意的：塞一顆
  # 預設的 false 進去會讓「還沒填」與「填了 false」看起來一模一樣。於是「我就是
  # 要一個常數 false」在畫布上原本沒有出口，只能繞 `不成立 (空孔)`，而那顆積木
  # 讀起來像在問問題。兩顆沒有參數的積木把那條路補上。

  - section: true
  - opcode: "true"
    type: boolean
    text: "真"

  - opcode: "false"
    type: boolean
    text: "假"

  - opcode: and
    type: boolean
    text: "%(a) 且 %(b)"
    args: { a: { type: boolean, default: false }, b: { type: boolean, default: false } }

  - opcode: or
    type: boolean
    text: "%(a) 或 %(b)"
    args: { a: { type: boolean, default: false }, b: { type: boolean, default: false } }

  - opcode: not
    type: boolean
    text: "不成立 %(value)"
    args: { value: { type: boolean, default: false } }

  # ---- 字串。索引 1-based（§4.3）。----

  - section: true
  - opcode: join
    type: reporter
    returns: string
    text: "連接 %(a) 和 %(b)"
    args: { a: { type: string, default: "你好" }, b: { type: string, default: "世界" } }

  - opcode: join_list
    type: reporter
    returns: string
    text: "用 %(separator) 連接 %(list)"
    args:
      list: { type: list }
      separator: { type: string, default: "," }

  - opcode: letter_of
    type: reporter
    returns: string
    text: "%(text) 的第 %(index) 個字"
    args:
      text: { type: string, default: "你好世界" }
      index: { type: number, default: 1 }

  - opcode: length
    type: reporter
    returns: number
    text: "%(text) 的長度"
    args: { text: { type: string, default: "你好世界" } }

  - opcode: contains
    type: boolean
    text: "%(a) 包含 %(b)"
    args: { a: { type: string, default: "你好世界" }, b: { type: string, default: "世界" } }

  - opcode: substring
    type: reporter
    returns: string
    text: "%(text) 的第 %(start) 到 %(end) 個字"
    args:
      text: { type: string, default: "你好世界" }
      start: { type: number, default: 1 }
      end: { type: number, default: 2 }

  - opcode: replace
    type: reporter
    returns: string
    text: "把 %(text) 裡的 %(find) 換成 %(replace)"
    args:
      text: { type: string, default: "你好世界" }
      find: { type: string, default: "世界" }
      replace: { type: string, default: "朋友" }

  - opcode: split
    type: reporter
    returns: list
    # separator 為空字串時逐字切開
    text: "用 %(separator) 分割 %(text)"
    args:
      text: { type: string, default: "甲,乙,丙" }
      separator: { type: string, default: "," }

  - opcode: trim
    type: reporter
    returns: string
    text: "去除 %(text) 的頭尾空白"
    # 樣本值刻意留著頭尾空白——這顆積木的效果只有在有空白時才看得見
    args: { text: { type: string, default: "  你好  " } }

  - opcode: case
    type: reporter
    returns: string
    text: "把 %(text) 轉成 %(case)"
    args:
      # 大小寫的樣本值只能是英文——中文沒有大小寫，樣本就示範不出東西
      text: { type: string, default: "hello" }
      case:
        type: dropdown
        field: true
        default: upper
        options:
          - { value: upper, label: "大寫" }
          - { value: lower, label: "小寫" }

  - section: true
  - opcode: regex_match
    type: boolean
    text: "%(text) 符合樣式 %(pattern)"
    args:
      pattern: { type: string, default: '\d+' }
      text: { type: string, default: "訂單 12345" }

  - opcode: regex_extract
    type: reporter
    # 有群組時回群組清單，沒有時回整段符合的文字，找不到回空字串——所以是 any
    returns: any
    text: "從 %(text) 取出樣式 %(pattern)"
    args:
      pattern: { type: string, default: '\d+' }
      text: { type: string, default: "訂單 12345" }

  - opcode: regex_replace
    type: reporter
    returns: string
    text: "把 %(text) 裡符合 %(pattern) 的換成 %(replace)"
    args:
      pattern: { type: string, default: '\d+' }
      text: { type: string, default: "訂單 12345" }
      replace: { type: string, default: "#" }

  - section: true
  - opcode: random
    type: reporter
    returns: number
    text: "隨機取 %(from) 到 %(to)"
    args:
      from: { type: number, default: 1 }
      to: { type: number, default: 10 }
