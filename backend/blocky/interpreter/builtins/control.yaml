# control 命名空間的宣告（D21）。
#
# 與 `control.py` 並列，格式與 `extensions/*/manifest.yaml` 完全相同——這是
# D21 的全部內容：內建積木不走第二條路。改 handler 時這份就在眼前。
#
# `stack` 型參數是 C 型積木的內部堆疊（§4.2 的 StackInput）；它沒有出現在
# `text` 裡，因為 Blockly 的 C 型積木把堆疊畫在文字下方而不是文字裡。
manifestVersion: 1
builtin: true
id: control
name: 控制
version: 1.0.0
color: "#FFAB19"
description: 條件、迴圈、等待、錯誤處理

palette:
  - opcode: if
    type: command
    text: "如果 %(condition) 那麼"
    args:
      condition: { type: boolean, default: false }
      then: { type: stack }

  - opcode: if_else
    type: command
    text: "如果 %(condition) 那麼 ⋯ 否則"
    args:
      condition: { type: boolean, default: false }
      then: { type: stack }
      else: { type: stack }
    # §16 Q19 的第一個消費者：積木右下角的 `+` `−` 長出「否則如果」。
    #
    # 沒有它，`如果⋯否則如果⋯否則` 只能靠巢狀——而三層之後那個縮排在
    # Scratch 的視覺文法裡就已經讀不動了（這是 Scratch 本身最常被抱怨的一點）。
    repeat:
      label: "否則如果 %(condition) 那麼"
      # 新增的那幾份落在 `否則` 之前——宣告的順序說不出這件事，因為 `else`
      # 是最後一格而重複的東西也在最後。
      before: else
      args:
        condition: { type: boolean, default: false }
        body: { type: stack }

  - section: true
  - opcode: repeat
    type: command
    text: "重複 %(times) 次"
    args:
      # 次數在進入迴圈前求值一次（control.py），與 Scratch 一致
      times: { type: number, default: 10 }
      body: { type: stack }

  - opcode: repeat_until
    type: command
    text: "重複直到 %(condition)"
    args:
      condition: { type: boolean, default: false }
      body: { type: stack }

  - opcode: forever
    type: command
    text: "重複無限次"
    args:
      body: { type: stack }

  - opcode: for_each
    type: command
    text: "對 %(list) 的每一項 %(name)"
    args:
      # binds + scope：迴圈變數由這顆積木建立，而它**只在迴圈體裡看得見**
      # （§5.4 第 2 層，D29）。原本沒有 scope，於是它寫的是全域層——而全域層是
      # 同一個 Run 的所有 thread 共用的，兩條腳本各跑一個 `對每一項 item`、
      # 迴圈體裡有任何一個 await，兩邊就互相踩。
      name: { type: variable, default: "item", label: "項目變數", binds: true, scope: body }
      list: { type: list }
      body: { type: stack }

  - section: true
  - opcode: wait
    type: command
    text: "等待 %(seconds) 秒"
    args:
      seconds: { type: number, default: 1, min: 0 }

  - opcode: wait_until
    type: command
    text: "等待直到 %(condition)"
    args:
      condition: { type: boolean, default: false }

  - section: true
  - opcode: stop
    type: command
    # cap block（§16 Q18 決議：改）。`停止` 之後的積木永遠跑不到，而形狀不說
    # 這件事的話，使用者接得上去、按存檔才被打回來。
    #
    # 我們的 `scope` 只有「這個腳本」與「全部」兩個值，兩個在 Scratch 裡都是
    # cap。Scratch 另外有一個不是 cap 的 `stop [other scripts]`——那顆的形狀隨
    # 欄位值而變，要 mutator 才做得到。這個下拉再長出第三個值時要重看這一行。
    terminal: true
    text: "停止 %(scope)"
    args:
      scope:
        type: dropdown
        field: true
        default: this_script
        options:
          - { value: this_script, label: "這個腳本" }
          - { value: all, label: "全部" }

  # 與 `try_catch` 成對。沒有它，`嘗試 ⋯ 出錯時` 只接得到別人丟的錯誤，而
  # 「這份資料不對，別再往下做了」是工作流最常見的一種失敗。
  - opcode: throw
    type: command
    # cap block，同 `停止` 與 `回傳`（§4.6）：丟出去之後的積木永遠跑不到，
    # 而形狀不說這件事的話，使用者接得上去、按存檔才被打回來。
    terminal: true
    text: "丟出錯誤 %(message)"
    args:
      message: { type: string, default: "出錯了" }

  - opcode: try_catch
    type: command
    # §5.6：只捕捉積木層級的錯誤。return / stop / 取消必須穿透。
    text: "嘗試 ⋯ 出錯時把錯誤存進 %(error_name)"
    args:
      try: { type: stack }
      # binds + scope：錯誤變數由 catch 綁定（§5.4 第 2 層 thread-local），
      # 範圍是 `catch` 那一疊——**不是 `try`**（那時候還沒有錯誤），也不是
      # try_catch 之後（D29：那會讓同一個位置的值取決於這次有沒有出錯）。
      error_name: { type: variable, default: "error", label: "錯誤變數", binds: true, scope: catch }
      catch: { type: stack }
