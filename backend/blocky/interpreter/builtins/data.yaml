# data 命名空間的宣告（D21）。
#
# `name` 在變數積木上是 `variable` 型（§8.5 的名稱自動完成、重新命名要跟著
# 走），但在 `persist_*` 上是普通字串 field——持久值是另一個命名空間（§5.4
# 第 4 層），它的 key 不是變數，不該出現在變數面板，也不該被重新命名波及。
#
# **這裡的 `value` 孔刻意沒有預設值**，儘管空欄位看起來像壞掉。Scratch 的
# `set my variable to (0)` 之所以能寫 0，是因為它的欄位知道自己是數字；這裡
# 的字面值目前只有一種型別——文字框打出來的字串（§16 Q16）。宣告 `default: 0`
# 會存成字串 `"0"`，於是 `如果 count = 0` 為假（§4.4.1 不做型別轉換），而那是
# 使用者永遠查不出來的一個錯。等 Q16 有了答案（第 6 步），這裡才補得下去。
#
# 變數名稱欄位（`name`）同樣留空：它必須由使用者命名，而「空欄位很難發現」
# 的解法是 §8.5 的 autocomplete（第 6 步），不是塞一個假名字進去。
manifestVersion: 1
builtin: true
id: data
name: 資料
version: 1.0.0
color: "#FF8C1A"
description: 免宣告變數、清單操作、跨執行的持久值

palette:
  # ---- 變數（§4.5）。寫入即建立，讀取未建立的變數是錯誤。----

  - opcode: set
    type: command
    text: "設定 %(name) 為 %(value)"
    args:
      # binds：這一格建立名字。`change` 與 `get` 沒有這個宣告，於是編輯器的
      # 靜態檢查（§4.5）知道「只被 change/get 提到過的名字」是打錯字。
      name: { type: variable, default: "", binds: true }
      value: { type: string, default: "" }

  - opcode: change
    type: command
    # §4.5：同樣要求變數已存在。少打一顆 set，換來的是打錯字被靜默當成新變數。
    text: "改變 %(name) 增加 %(value)"
    args:
      # writes：它讀第 1/2/3 層、但寫的一定是第 3 層（§5.4）。D29 的存檔期檢查
      # 靠這個宣告認出它——`改變 [迴圈變數]` 讀的與寫的不是同一個東西。
      name: { type: variable, default: "", writes: true }
      value: { type: number, default: 1 }

  - opcode: get
    type: reporter
    returns: any
    # §4.5：**帶動詞**，不是 Scratch 那顆光禿禿的變數膠囊。這裡的變數名稱是
    # 寫在文字欄位裡的字串，一顆只有 `(count)` 的 reporter 跟一顆內容是 count
    # 的文字積木長得幾乎一樣；動詞是把那個區別放回畫面上最便宜的方式。
    # 積木文字不進 IR，所以改這一行不影響任何已存的專案。
    text: "取得 %(name)"
    args:
      # reads：**這顆積木回傳的就是這個名字的值**。原本是給函式分類用的（為每
      # 個參數各列一顆 `取得 (參數名)`，而不必寫死一個 opcode），但 §4.6 的參數
      # 後來改成 `procedure.param` 那顆光禿禿的膠囊，那個消費者就沒了。宣告留
      # 著——它說的仍然是一件真話，而 `data.get` 與 `data.list_length` 的宣告
      # 一模一樣（reporter + 一個 variable 參數），沒有它就分不出誰是「取得」。
      name: { type: variable, default: "", reads: true }

  - section: true
  - opcode: new_list
    type: reporter
    returns: list
    text: "空清單"

  - opcode: new_object
    type: reporter
    returns: object
    text: "空物件"

  # ---- 清單。索引 1-based（§4.3）。----

  - section: true
  - opcode: list_add
    type: command
    text: "把 %(item) 加到 %(name)"
    args:
      name: { type: variable, default: "" }
      item: { type: string, default: "" }

  - opcode: list_delete
    type: command
    text: "刪除 %(name) 的第 %(index) 項"
    args:
      name: { type: variable, default: "" }
      index: { type: number, default: 1 }

  - opcode: list_clear
    type: command
    text: "清空 %(name)"
    args:
      name: { type: variable, default: "" }

  - opcode: list_insert
    type: command
    # 索引允許 length+1（接在最後面），見 data.py 的 normalize_index(…, len+1)
    text: "把 %(item) 插入 %(name) 的第 %(index) 項"
    args:
      name: { type: variable, default: "" }
      item: { type: string, default: "" }
      index: { type: number, default: 1 }

  - opcode: list_replace
    type: command
    text: "把 %(name) 的第 %(index) 項換成 %(item)"
    args:
      name: { type: variable, default: "" }
      index: { type: number, default: 1 }
      item: { type: string, default: "" }

  - opcode: list_item
    type: reporter
    returns: any
    text: "%(name) 的第 %(index) 項"
    args:
      name: { type: variable, default: "" }
      index: { type: number, default: 1 }

  - opcode: list_length
    type: reporter
    returns: number
    text: "%(name) 的長度"
    args:
      name: { type: variable, default: "" }

  - opcode: list_contains
    type: boolean
    text: "%(name) 包含 %(item)"
    args:
      name: { type: variable, default: "" }
      item: { type: string, default: "" }

  - opcode: list_index_of
    type: reporter
    returns: number
    # 找不到回 0——1-based 用不到 0，正好是空出來的哨兵值（§4.3）
    text: "%(item) 在 %(name) 的位置"
    args:
      name: { type: variable, default: "" }
      item: { type: string, default: "" }

  # ---- 持久值（§5.4 第 4 層、D12）。key 不是變數。----

  - section: true
  - opcode: persist_set
    type: command
    text: "記住 %(name) 為 %(value)"
    args:
      name: { type: string, field: true, default: "" }
      value: { type: string, default: "" }

  - opcode: persist_get
    type: reporter
    returns: any
    # 有預設值孔而非報錯——持久值的「第一次執行」必然不存在（§5.4）
    text: "記住的 %(name)（沒有就用 %(default)）"
    args:
      name: { type: string, field: true, default: "" }
      default: { type: string, default: "" }

  - opcode: persist_has
    type: boolean
    text: "記得 %(name) 嗎"
    args:
      name: { type: string, field: true, default: "" }

  - opcode: persist_delete
    type: command
    text: "忘記 %(name)"
    args:
      name: { type: string, field: true, default: "" }
