# procedure 命名空間的宣告（D21、§4.6）。
#
# `definition` 與 `call` 是 **dynamic**：它們的參數來自 `project.procedures`
# 而不是這份宣告，工具箱也不列出它們（前端從專案資料生成）。`call` 另外是這
# 整份宣告裡唯一形狀不固定的積木——函式宣告了回傳型別它就是 reporter，沒宣告
# 就是 command（沒有輸出孔）。宣告寫 reporter，`dynamic` 補上另一半。
manifestVersion: 1
builtin: true
id: procedure
name: 函式
version: 1.0.0
color: "#FF6680"
description: 可回傳值的自訂函式

palette:
  # D25：工具箱的非積木條目。函式分類最上面那顆按鈕是**建立函式的唯一入口**
  # ——不是拖一顆「定義函式」出來。拖出來的作法要在 drop 事件裡配 proc id 與
  # 註冊型別，中間還會存在一個「還沒有名字的函式」，而那東西存進 `procedures`
  # 就是半成品（§8.5、D26）。
  - button: create
    label: "建立一個積木"
    action: create_procedure

  - opcode: definition
    type: hat
    dynamic: true
    text: "定義函式"

  - opcode: call
    type: reporter
    dynamic: true
    # 整份宣告裡唯一形狀不固定的積木：函式沒宣告回傳型別時它沒有輸出孔。
    alsoCommand: true
    returns: any
    text: "呼叫函式"

  # 定義帽子上那顆拖得出去的參數（§4.6）。Scratch 的
  # `argument_reporter_string_number`：**一顆光禿禿的膠囊**，上面只有參數名，
  # 沒有動詞——`取得 (次數)` 講的是「查一個變數」，而參數不是變數，它是這次
  # 呼叫傳進來的值，唯讀、只活在這個 frame 裡。
  #
  # dynamic：名字來自 `procedures[].params`，不是這份宣告，工具箱也不列出這顆
  # 空白的。前端為每個參數各生一組型別（`procedure.param#<proc>.<param>`），
  # 與 `definition` / `call` 同一條路。
  - opcode: param
    type: reporter
    dynamic: true
    returns: any
    text: "參數"

  # §16 Q6：函式的暫存變數。**不配對 `本次呼叫取得`**——§5.4 第 1 層就是 frame，
  # 既有的 `取得 (名稱)` 本來就讀得到它；再發一顆讀取積木要嘛是同一件事兩個入口
  # （§4.6 否決「參數在分類裡再列一份」的同一條理由），要嘛得把它放進獨立命名
  # 空間，而那樣 `${}` 就讀不到它。
  #
  # 名字取「本次呼叫」而不是「區域設定」：後者在中文電腦語境會被讀成 locale
  # （控制台那個「地區設定」）。而「本次呼叫」與變數 pill 上已經在用的「本次
  # 事件」（第 2 層）是同一家人——四層讀起來是 參數 / 本次呼叫 / 本次事件 / 全域。
  - opcode: set_local
    type: command
    text: "本次呼叫 %(name) 為 %(value)"
    args:
      # binds + scope: frame——寫進當前 frame（§5.4 第 1 層），遞迴與並行各自
      # 一份。範圍是**所在的函式體**，而函式體不是一疊 stack（它掛在定義積木的
      # `next` 上），所以這裡是保留字而不是某一格的名字。
      name: { type: variable, default: "", label: "變數名稱", binds: true, scope: frame }
      value: { type: string, default: "" }

  - opcode: return
    type: command
    # cap block：下面不能接積木（`terminal`，前端不畫下凸點、後端載入期擋），
    # 且只能放在函式定義裡面（載入期驗證，§4.6）
    terminal: true
    text: "回傳 %(value)"
    args:
      value: { type: string, default: "" }
