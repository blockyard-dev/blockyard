# event 命名空間的宣告（D21）。
#
# 這個命名空間**沒有 event.py**：hat 積木不被「執行」，引擎從 `hat.next` 起跑
# （§5.1）。所以這裡是純宣告——它同時是「引擎不認得的 hat 就是錯的」那條
# 形狀驗證的資料來源（D20）。
manifestVersion: 1
builtin: true
id: event
name: 事件
version: 1.0.0
color: "#FFBF00"
description: 腳本的起點。每個腳本最上面必須是一顆事件積木

palette:
  - opcode: when_flag_clicked
    type: hat
    text: "當 ▶ 被點擊"
    concurrency: parallel

  - opcode: when_cron
    type: hat
    text: "當時間到 %(cron) 時區 %(timezone)"
    args:
      cron: { type: string, field: true, default: "0 9 * * *", help: "cron 運算式：分 時 日 月 星期。例如 0 9 * * * 是每天早上九點" }
      # **必填**（§9.1、§4.9）：沒有它，同一份專案在不同機器上會在不同時刻
      # 觸發——與 D11 拒絕「可設定的索引基底」是同一個理由。
      #
      # **刻意沒有 default。** 給 `UTC` 的話，一個台北的使用者設「早上九點」會
      # 在下午五點觸發，而積木上只寫著一個他沒讀的字。這是 §4.9 要防的那件事
      # 的另一面：可攜性守住了，但意思錯了。空的則存不進去（存檔期 422 帶
      # blockId），使用者一定會看到那句話。
      timezone: { type: string, field: true, default: "", help: "IANA 時區名稱，例如 Asia/Taipei" }
    yields:
      - { name: scheduled_at, type: object }
    concurrency: drop

  - opcode: when_webhook
    type: hat
    text: "當收到 webhook %(path) %(verify) %(signature_header)"
    args:
      path: { type: string, field: true, default: "hook", help: "網址的最後一段，例如 github。完整網址在啟用之後從積木上複製" }
      # §9.3 的簽章驗證（§16 Q22 決議 (a)）。**這三格都不是秘密**——密鑰進
      # keyring，key 是專案 + blockId，因為 D28 說 Key 不能存進專案檔。
      #
      # 預設 `none`：多數 webhook 來源不簽章，而一個預設就要求密鑰的欄位會讓
      # 最常見的那條路先失敗一次。
      verify:
        type: dropdown
        field: true
        default: none
        label: 驗證簽章
        options:
          - { value: none, label: "不驗" }
          - { value: hmac_sha256, label: "HMAC-SHA256" }
          - { value: hmac_sha1, label: "HMAC-SHA1" }
      signature_header:
        type: string
        field: true
        default: ""
        label: 簽章 header
        help: "GitHub 是 X-Hub-Signature-256。不驗的話留空"
    yields:
      - { name: body, type: object }
      - { name: headers, type: object }
      - { name: query, type: object }
    concurrency: parallel
