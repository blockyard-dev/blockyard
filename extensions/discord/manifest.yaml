# Discord 積木包（§15、P1 第 4 步）。
#
# 三個手寫包裡它排最後，因為它是**唯一需要常駐連線**的：`on_message` 是第一顆
# 由積木包宣告的 hat（§5.4、§9），而 §7.3 的 `@trigger` 到目前為止只有合約測試
# 裡的 `demo` 包用過。前兩個包都只有 reporter。
#
# **這個包有兩種 client，生命週期不同**，而這件事是翻 discord.py 2.7.1 的原始碼
# 才看清楚的：`Client.login()` 是**純 REST** 的（`client.py:647`——它只打
# `GET /users/@me` 與 `application_info()`，不碰 gateway），`Client.start()` 才是
# `login()` + `connect()`。所以 `send_message` 與 `get_channel_history` 不需要
# 常駐連線、不需要 privileged intents、也不需要等 `on_ready`；只有 `on_message`
# 那顆 hat 要開 WebSocket。一個 client 打天下會讓「發一則訊息」這件事付出一整條
# gateway 連線的代價，而那條連線還會因為少了 message_content 這個 intent 而失敗。
#
# **`ctx.http` 在這個包身上守不住，這裡老實寫下來**（§12.1）：`HTTPClient`
# 在 `static_login()` 裡自己 `aiohttp.ClientSession(...)` 建下去
# （`discord/http.py:831`），沒有 `AsyncOpenAI(http_client=...)` 那種注入點。
# 不為了硬塞而去改 SDK 的連線層——`permissions: [net]` 在這個包上退回成安裝
# 畫面上的一句話，`requirements` 的 venv 隔離才是真的守得住的那一半。
manifestVersion: 1
id: discord
name: Discord
version: 0.1.0
author: blockyard
description: 發訊息到頻道、讀頻道歷史
color: "#5865F2"
# 擴充功能面板那張卡上 16:9 的一格。包目錄內的相對路徑，沒宣告就畫名字的第一
# 個字（編輯器那條 fallback 本來就在，載不出來也會退回去）。
cover: preview.png

permissions: [net]
# 2.7.1 是寫這一版時裝下來的版本。範圍照 §7.2 的宣告不動：2.x 之內 `login`／
# `get_partial_messageable`／`history` 的形狀是穩定的，3 不知道會變成什麼。
requirements: ["discord.py>=2.3,<3"]

config:
  # 存進 OS keyring，不進 project.json（§12.1）。Bot Token 比 API 金鑰更該藏：
  # 它不只是花錢的權限，是以那隻 bot 的身分在別人的伺服器裡說話的權限。
  - key: bot_token
    type: secret
    label: Bot Token
    envVar: DISCORD_BOT_TOKEN
    help: Developer Portal → 你的 App → Bot → Reset Token。它只會顯示一次

palette:
  # 最短的一顆。`channel` 收頻道 ID，也收整條頻道網址——後者才是使用者剪貼簿
  # 裡真的有的東西（在 Discord 裡按「複製連結」比「複製頻道 ID」少一個要先去
  # 設定裡開開發者模式的步驟）。只認 ID 的話，貼上去會得到一句「這不是數字」，
  # 而使用者手上並沒有第二個東西可以貼。
  - opcode: send_message
    type: command
    text: "發送訊息 %(message) 到 %(server) 的 %(channel)"
    args:
      message:
        type: string
        default: "哈囉，我是積木"
        multiline: true
        rows: 3
      server: { type: dropdown, source: servers, default: "", label: 伺服器 }
      # **這一格是 `depends` 存在的理由。** 頻道屬於某一個伺服器，而「所有伺服器
      # 的所有頻道攤平成一份清單」對一個待在十個伺服器裡的人來說是幾百個名字，
      # 其中好幾個叫「一般」——那份清單不是太長，是**問不出來**：不知道伺服器就
      # 沒有那個 API 可以打。`http.method` 與 `openai.models` 都沒有這個形狀，
      # 所以這個能力一路拖到現在才做（PROGRESS 3.4）。
      channel:
        type: dropdown
        source: channels
        depends: [server]
        default: ""
        label: 頻道

  - section: true

  # 說明按鈕放在需要它的那一刻旁邊（同 http、openai 的作法）：要拿 token、要開
  # Message Content Intent，兩件事都在 Developer Portal 的同一頁上。
  - button: portal
    label: "Developer Portal（拿 Token、開 Intent）"
    action: open_url
    url: "https://discord.com/developers/applications"

  # 拿到 token 的下一步就是貼進來，所以按鈕就排在上面那顆的下面。
  #
  # **這顆按鈕的使用者是「下拉點開來是空的」那個人。** 伺服器與頻道兩格都要先
  # 有 token 才問得出東西，而在此之前它們畫出來就是一格提示字——現在點開至少
  # 會看到「還沒設定「Discord」的 Bot Token」（下拉會把後端那句話顯示出來），
  # 但看到之後他還是得自己去右上角找面板。這顆按鈕把那段路收成一下：跳到金鑰
  # 面板，而且**這一把已經填好**，剩下的只有貼上。
  - button: bot_token
    label: "設定 Bot Token"
    action: open_config

  # 回 list，讓 `對每一項` 直接接得上。一則訊息回一個 object 而不是一串字：
  # 誰說的、什麼時候說的、內容是什麼，是三件不同的事，黏成一句話之後要在畫布
  # 上再拆一次。
  - opcode: get_channel_history
    type: reporter
    returns: list
    text: "取得 %(server) 的 %(channel) 最近 %(limit) 則訊息"
    args:
      server: { type: dropdown, source: servers, default: "", label: 伺服器 }
      channel:
        type: dropdown
        source: channels
        depends: [server]
        default: ""
        label: 頻道
      limit:
        type: number
        default: 10
        min: 1
        max: 100
        help: 由新到舊

  - section: 事件

  # **這個包唯一需要常駐連線的東西**，也是第一顆由積木包宣告的 hat（§5.4、§9）。
  # 前兩個包都只有 reporter，所以 §7.3 的 `@trigger` 到目前為止只有合約測試裡的
  # `demo` 用過。
  #
  # **收到的那則訊息綁成積木上寫著的那個名字**（D32），與 `嘗試 ⋯ 出錯時把錯誤
  # 存進 (error)` 是同一格東西。原本四個 yields（`content`／`author`／
  # `channel_id`／`message`）收成這一個物件：名字由積木包作者取的時候，四個看不
  # 見的名字就是四次「我的全域變數 `content` 怎麼變成訊息內容了」（§4.5 那段自己
  # 記著這件事）；使用者取得起名字，要小心的就只剩下他自己寫在積木上的那一個。
  #
  # **那一格不是「參數」。** 「只聽某個頻道」才是參數，而它仍然沒有：hat 的參數
  # 要一路穿過 `start_trigger` 才到得了 `@trigger` 函式，而 §9.2 的 trigger 生命
  # 週期（diff 新舊 hat 集合、只重啟有變動的那條長連線）本來就是後面的事。這一格
  # 從不離開 host——它只決定 yield 綁成哪個名字，所以那條路一步都不用先開。
  # 過濾用 `如果 ${message.channel_id} = …` 做得到，而且看得見。
  #
  # `message.content` 要靠 privileged 的 Message Content Intent 才有東西（Developer
  # Portal → Bot → Privileged Gateway Intents）。沒開的話 connect 直接炸，
  # main.py 那句錯誤會把路徑寫出來。
  - opcode: on_message
    type: hat
    text: "當 Discord 收到訊息 %(message)"
    args:
      # 物件而不是一串字：誰說的、在哪個頻道說的、什麼時候說的，是幾件不同的
      # 事（`${message.content}`、`${message.author.bot}`、`${message.url}`）。
      # `如果 ${message.author.bot}` 是這顆 hat 底下最常見的第一顆 if——不濾掉
      # 別的 bot，兩隻互相回話的 bot 會打起來。
      message: { type: variable, binds: true, default: "message", label: 訊息變數 }
    yields:
      - { name: message, type: object }
    # 一則訊息一條 Thread。收訊息是天生併發的，drop 會在連續兩則訊息之間漏掉
    # 第二則，而使用者看到的是「有時候有反應有時候沒有」。
    concurrency: parallel
