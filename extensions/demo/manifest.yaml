# 假的示範積木包（§7.1）。
#
# 存在的理由：在真的 API 進來之前，先把 Host 邊界（§7.5）做對。純函式、不打
# 網路、不需要金鑰，所以它可以進 §17 的題庫，成為「manifest → 積木 → 執行」
# 這條路的回歸網。P1 的 http / openai / discord 走的是同一條路，屆時錯的只會
# 是網路，不會是架構。
manifestVersion: 1
id: demo
name: 示範
version: 0.1.0
author: blocky
description: 驗證 Host 邊界用的假積木包，不打任何外部服務
color: "#7C5CFF"
permissions: []
requirements: []

config:
  - key: greeting
    type: string
    label: "打招呼用的開頭"
    default: "hi"

palette:
  # 最單純的一顆：吃字串、吐字串，順便驗 ctx.config / ctx.state / ctx.log
  - opcode: echo
    type: reporter
    returns: string
    text: "回聲 %(text)"
    args:
      text: { type: string, default: "world" }

  # command 形狀：沒有輸出孔，回傳值必須是 null（§7.5 的出口檢查）
  - opcode: announce
    type: command
    text: "宣布 %(text)"
    args:
      text: { type: string, default: "", multiline: true, rows: 2 }

  # `json` 是結構化資料入口：字串在邊界被 parse，main.py 永遠拿到 dict / list
  - opcode: wrap
    type: reporter
    returns: object
    text: "把 %(body) 包成物件"
    args:
      body: { type: json, default: "{}" }

  # number 在邊界依 §4.3 轉換，並檢查 manifest 宣告的 min / max
  - opcode: add
    type: reporter
    returns: number
    text: "%(a) 加 %(b)"
    args:
      a: { type: number, default: 0 }
      b: { type: number, default: 0, min: 0, max: 100 }

  - opcode: is_even
    type: boolean
    text: "%(n) 是偶數"
    args:
      n: { type: number, default: 0 }

  # 動態下拉（§8.1）：選項由 main.py 的 @dropdown 提供
  - opcode: color_of
    type: reporter
    returns: string
    text: "水果 %(fruit) 的顏色"
    args:
      fruit: { type: dropdown, source: list_fruits }   # 沒有 default = 必填

  # 刻意壞掉的一顆：宣告回傳物件卻回字串。它是 §7.5 出口驗證的題目本身，
  # 用意是讓「積木包寫錯」與「使用者流程寫錯」在訊息上分得開。
  - opcode: broken_returns
    type: reporter
    returns: object
    text: "宣告物件卻回文字（故意的）"

  # object / list 是嚴格宣告：邊界上唯一不套 §4.3 轉換表的型別（§7.2）
  - opcode: count_items
    type: reporter
    returns: number
    text: "%(items) 的項數"
    args:
      items: { type: list }

  # §7.5 的隱含約束：回傳值必須可 JSON 序列化。這一顆故意違反。
  - opcode: not_transportable
    type: reporter
    returns: any
    text: "回一個傳不過 process 邊界的值（故意的）"

  # 積木包自己炸掉時，錯誤要指名是誰炸的
  - opcode: blow_up
    type: command
    text: "故意丟一個 Python 例外"

  - opcode: on_tick
    type: hat
    text: "每一拍"
    yields:
      - { name: tick, type: number }
    concurrency: parallel
