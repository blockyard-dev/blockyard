# 面板積木包。
#
# **整包就是「積木包自己寫面板」的示範**（§16 Q17 的 B 路線）：畫圖的是
# `ui/` 底下的 HTML/CSS/JS，跑在編輯器給的一格 sandbox iframe 裡。編輯器
# **一個字都不解讀**那些訊息——它只把 `ctx.send_panel()` 送的東西原樣轉過去。
#
# 這件事的意義是：以後任何人要畫別的東西（three.js、地圖、時間軸），寫的是
# 自己的 `ui/`，不必來改編輯器一行程式碼。編輯器不知道什麼是折線圖。
manifestVersion: 1
id: panel
name: 面板
version: 2.0.0
author: blockyard
description: 把資料畫成圖表、表格與數值卡
color: "#222222"
# 擴充功能面板那張卡上 16:9 的一格。包目錄內的相對路徑，沒宣告就畫名字的第一
# 個字（編輯器那條 fallback 本來就在，載不出來也會退回去）。
cover: preview.png

permissions: []
requirements: []

panels:
  - id: chart
    name: 圖表
    entry: ui/index.html

palette:
  - opcode: line_chart
    type: command
    text: "在面板畫折線圖 %(data)"
    args:
      # 一串數字，x 軸是序號。要吃 `[{時間, 值}]` 的話用 `加一個點`——同一顆
      # 積木嗅探兩種形狀是 D24／D27 一路在避免的事。
      data: { type: list }

  - opcode: add_point
    type: command
    text: "在圖表加一個點 x %(x) y %(y)"
    args:
      x: { type: number, default: 0 }
      y: { type: number, default: 0 }

  # 累加起來的東西要有辦法歸零，否則第二條序列會接在第一條後面。
  - opcode: clear
    type: command
    text: "清空圖表"

  - section: 其他

  - opcode: stat
    type: command
    text: "在面板顯示數值 %(name) 為 %(value)"
    args:
      # 名字是這張數值卡的身分：同一個名字送第二次是換掉它，不是再長一張。
      name: { type: string, default: "總數" }
      value: { type: string, default: "0" }

  - opcode: table
    type: command
    text: "在面板畫表格 %(data)"
    args:
      # 一串物件。欄位是所有列的聯集，缺的那一格畫空白。
      data: { type: list }
